<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBAAS — Official Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        header { background: #0f172a; color: white; padding: 25px; text-align: center; }
        header h1 { font-size: 26px; letter-spacing: 3px; }
        header p { font-size: 13px; color: #94a3b8; margin-top: 5px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card h3 { font-size: 16px; margin: 12px 0 5px; color: #0f172a; }
        .price { font-size: 16px; color: #16a34a; font-weight: bold; margin-bottom: 12px; }
        .btn-cod { display: inline-block; background-color: #25D366; color: white; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; width: 85%; }
    </style>
</head>
<body>

    <header>
        <h1>LIBAAS</h1>
        <p>Cash on Delivery Orders</p>
    </header>

    <div class="container">
        <div class="grid">
            
            <!-- PRODUCT 1 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x400" alt="Item 1">
                <h3>Embroidered Lawn Suit</h3>
                <div class="price">Rs. 3,500</div>
                <a class="btn-cod" target="_blank" 
                   href="https://api.whatsapp.com/send?text=Hi%20Libaas!%20I%20want%20to%20order:%20Embroidered%20Lawn%20Suit%20(Rs.%203500)%20via%20Cash%20on%20Delivery.%20Address:">
                   💬 Order COD via WhatsApp
                </a>
            </div>

            <!-- PRODUCT 2 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x400" alt="Item 2">
                <h3>Printed Cotton Kurti</h3>
                <div class="price">Rs. 2,200</div>
                <a class="btn-cod" target="_blank" 
                   href="https://api.whatsapp.com/send?text=Hi%20Libaas!%20I%20want%20to%20order:%20Printed%20Cotton%20Kurti%20(Rs.%202200)%20via%20Cash%20on%20Delivery.%20Address:">
                   💬 Order COD via WhatsApp
                </a>
            </div>

        </div>
    </div>

</body>
</html>
